[package]
name = "bertopic_gui"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.27"
egui_extras = { version = "0.27", features = ["default", "image"] }
image = { version = "0.24", features = ["jpeg", "png"] }
pyo3 = { version = "0.23", features = ["auto-initialize"] }
mimalloc = "0.1"
reqwest = { version = "0.12", features = ["blocking"] }
serde_json = "1"



[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
